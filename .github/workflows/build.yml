name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 打 tag 时创建 Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 配置了签名 Secrets -> 构建正式签名 release APK
      # 未配置           -> 构建 debug 签名 APK（同样可直接安装到手机）
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "==> 使用正式签名构建 release APK"
            gradle :app:assembleRelease --stacktrace
            OUT_DIR="app/build/outputs/apk/release"
          else
            echo "==> 未配置签名 Secrets，构建 debug 签名 APK"
            gradle :app:assembleDebug --stacktrace
            OUT_DIR="app/build/outputs/apk/debug"
          fi
          APK=$(ls "${OUT_DIR}"/*.apk | head -n 1)
          cp "${APK}" nas-webview.apk
          echo "==> 打包完成: ${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nas-webview-apk
          path: nas-webview.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: nas-webview.apk
          generate_release_notes: true
